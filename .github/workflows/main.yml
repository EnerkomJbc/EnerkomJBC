name: EDC automatický export

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Načíst soubory repozitáře
        uses: actions/checkout@v4

      - name: Připravit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ověřit dostupnost serverů EDC
        run: |
          for host in portal.edc-cr.cz sso.portal.edc-cr.cz api.portal.edc-cr.cz www.edc-cr.cz; do
            echo "TEST https://$host/"
            curl --connect-timeout 10 --max-time 25 -sS -L -o /dev/null -w 'HTTP %{http_code} | DNS %{remote_ip} | čas %{time_total}s\\n' "https://$host/" || echo "CURL_ERROR=$?"
          done

      - name: Nainstalovat Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Ověřit přítomnost přihlašovacích údajů
        env:
          EDC_USERNAME: ${{ secrets.EDC_USERNAME }}
          EDC_PASSWORD: ${{ secrets.EDC_PASSWORD }}
        run: |
          python -c "import os; print('Uživatelské jméno:', 'NASTAVENO' if os.getenv('EDC_USERNAME') else 'CHYBÍ'); print('Heslo:', 'NASTAVENO' if os.getenv('EDC_PASSWORD') else 'CHYBÍ')"

      - name: Otestovat přihlášení do EDC
        env:
          EDC_USERNAME: ${{ secrets.EDC_USERNAME }}
          EDC_PASSWORD: ${{ secrets.EDC_PASSWORD }}
        run: |
          python EDC/test_edc_login.py
